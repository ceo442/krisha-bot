name: krisha-bot

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: krisha-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Run bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          RUN_MINUTES: "9"
        run: python3 bot.py ci

      - name: Save state
        if: always()
        run: |
          git config user.name "krisha-bot"
          git config user.email "krisha-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "update state" && git push)
